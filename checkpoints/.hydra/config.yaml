datamodule:
  transforms:
    combine_goal_obs: false
    move_axis: false
    bytes_to_string: true
    adjust_type: null
    add_robot_information: true
  language_encoders:
    _target_: flower_vla.agents.lang_encoders.florence_tokens.TokenVLM
    _recursive_: false
    model_name: microsoft/Florence-2-large
  _target_: flower_vla.dataset.datamodule.UhaDataModule
  _recursive_: false
  num_workers: ${num_workers}
  batch_size: ${batch_size}
  pin_memory: ${pin_memory}
  drop_last: ${drop_last}
  datasets:
    DATA_NAME: ${DATA_NAME}
    DATA_PATH: gs://gresearch/robotics
    load_camera_views: ${load_camera_views}
    dataset_size_limit: ${dataset_size_limit}
    action_proprio_normalization_type: bounds
    proprio_obs_key: proprio
    interleaved_dataset_cfg:
      shuffle_buffer_size: ${shuffle_buffer_size}
      balance_weights: true
      traj_transform_kwargs:
        goal_relabeling_strategy: ${goal_relabeling_strategy}
        goal_relabeling_kwargs:
          goal_relabeling_kwargs:
            min_bound: 20
            max_bound: 50
            frame_diff: 3
        window_size: ${obs_seq_len}
        action_horizon: ${act_seq_len}
        max_action_dim: ${act_dim}
        max_proprio_dim: ${max_proprio_dim}
        subsample_length: ${subsample_length}
        skip_unlabeled: ${skip_unlabeled}
      frame_transform_kwargs:
        image_augment_kwargs:
          primary:
            random_resized_crop:
              scale:
              - 0.8
              - 1.0
              ratio:
              - 0.9
              - 1.1
            random_brightness:
            - 0.1
            random_contrast:
            - 0.9
            - 1.1
            random_saturation:
            - 0.9
            - 1.1
            random_hue:
            - 0.05
            augment_order:
            - random_resized_crop
            - random_brightness
            - random_contrast
            - random_saturation
            - random_hue
          secondary:
            random_resized_crop:
              scale:
              - 0.8
              - 1.0
              ratio:
              - 0.9
              - 1.1
            random_brightness:
            - 0.1
            random_contrast:
            - 0.9
            - 1.1
            random_saturation:
            - 0.9
            - 1.1
            random_hue:
            - 0.05
            augment_order:
            - random_resized_crop
            - random_brightness
            - random_contrast
            - random_saturation
            - random_hue
          wrist:
            random_brightness:
            - 0.1
            random_contrast:
            - 0.9
            - 1.1
            random_saturation:
            - 0.9
            - 1.1
            random_hue:
            - 0.05
            augment_order:
            - random_brightness
            - random_contrast
            - random_saturation
            - random_hue
        resize_size:
          primary:
          - 224
          - 224
          secondary:
          - 224
          - 224
          wrist:
          - 224
          - 224
        resize_size_future_obs:
          primary:
          - 112
          - 112
          secondary:
          - 112
          - 112
          wrist:
          - 112
          - 112
        num_parallel_calls: 64
      traj_transform_threads: 12
      traj_read_threads: 12
trainer:
  agent:
    _target_: flower_vla.agents.ddp_wrapper.DDPAgentWrapper
    _recursive_: false
    obs_modalities: ${obs_modalities}
    goal_modalities: ${goal_modalities}
    img_modalities: ${img_modalities}
    lang_modalities: ${lang_modalities}
    target_modality: ${target_modality}
    agent:
      _target_: flower_vla.agents.flower.FlowerVLA
      _recursive_: false
      obs_modalities: ${obs_modalities}
      goal_modalities: ${goal_modalities}
      img_modalities: ${img_modalities}
      lang_modalities: ${lang_modalities}
      target_modality: ${target_modality}
      vlm_path: microsoft/Florence-2-large
      freeze_florence: false
      freeze_vision_tower: false
      freeze_embeddings_only: true
      use_second_view: false
      token_dropout: 0.1
      sampling_type: uniform
      second_view_key: image_secondary
      multistep: ${act_seq_len}
      num_sampling_steps: 4
      lowdim_obs_dim: ${obs_dim}
      action_dim: ${act_dim}
      act_window_size: ${act_seq_len}
      use_causal_attention: true
      use_proprio: true
      action_type_adaln: true
      dit_dim: 1024
      n_heads: 16
      n_layers: 12
      attn_pdrop: 0.1
      resid_pdrop: 0.1
      mlp_pdrop: 0.1
      use_cross_attn: true
      use_adaln_cond: false
      use_rope: true
      use_nope: false
      query_seq_len: 100
      rope_theta: 1000.0
  _target_: flower_vla.trainers.flower_trainer.AccelerateTrainer
  _recursive_: false
  use_torch_compile: false
  single_optimizer: false
  test_overfit: false
  learning_rate_dit: 0.0001
  learning_rate_vlm: 2.0e-05
  beta_dit_1: 0.9
  beta_dit_2: 0.95
  beta_vlm_1: 0.9
  beta_vlm_2: 0.999
  weight_decay:
    transformer_weight_decay: 0.1
    vlm_weight_decay: 1.0e-09
  dit_lr_scheduler:
    _target_: flower_vla.utils.lr_schedulers.InverseSquareRootLRSchedule
    num_warmup_steps: 200
    timescale: 200000
  vlm_lr_scheduler:
    _target_: flower_vla.utils.lr_schedulers.TriStageLRScheduler
    init_lr_scale: 0.0001
    final_lr_scale: 0.95
    phase_ratio: (0.1, 0.89, 0.01)
    total_steps: 40000
  eval_every_n_steps: ${eval_every_n_steps}
  save_every_n_steps: ${save_every_n_steps}
  max_train_steps: ${max_train_steps}
  max_eval_steps: ${max_eval_steps}
  use_ema: false
  decay: ${decay}
  rampup_ratio: ${rampup_ratio}
  update_ema_every_n_steps: ${update_ema_every_n_steps}
  batch_size: ${batch_size}
  obs_modalities: ${obs_modalities}
  goal_modalities: ${goal_modalities}
  img_modalities: ${img_modalities}
  lang_modalities: ${lang_modalities}
  target_modality: ${target_modality}
